[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Function configuration - extend timeout for AI/scan operations
[functions]
  # Extend function timeout to maximum allowed (26 seconds for Pro, 10 for free)
  # Note: For longer operations, we use streaming which keeps connection alive
  node_bundler = "esbuild"
  
  # For scan-material specifically, use extended timeout
  [functions."scan-material"]
    # Background functions allow up to 15 minutes
    # Streaming functions stay alive as long as they're sending data

# Next.js configuration for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache API routes
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

